services:
  chatllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatllm:latest
    container_name: chatllm
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=7860
      - CHAT_HISTORY_DIR=/app/data/chat_history
    volumes:
      - chatllm_data:/app/data
    restart: unless-stopped

volumes:
  chatllm_data:
