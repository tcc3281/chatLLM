[project]
name = "chatllm"
version = "0.1.0"
description = "Gradio chat UI for testing OpenAI-compatible multimodal models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"gradio>=5.0.0",
	"markitdown[all]>=0.1.5",
	"openai>=1.40.0",
	"yt-dlp>=2025.01.15",
]

[project.scripts]
chatllm = "chatllm:main"
